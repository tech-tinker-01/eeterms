<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --text:#1a1d24; --muted:#6b7280; --line:#e6e8ef;
  --brand:#2f6fed; --brand-2:#7c5cff; --ok:#16a34a; --warn:#f59e0b; --bad:#ef4444;
  --chip:#eef2ff; --shadow:0 2px 10px rgba(20,30,60,.06); --radius:14px;
}
[data-theme="dark"]{
  --bg:#0f1117; --card:#171a22; --text:#e8eaf0; --muted:#98a1b3; --line:#252a36;
  --brand:#5b8dff; --brand-2:#9b83ff; --chip:#1f2433;
  --shadow:0 2px 12px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 注意：不要给 html/body 同时加 overflow-x:hidden —— 会让 body 变成滚动容器，
   安卓 Chrome 上单指滑动会失效（必须两根手指）。横向溢出靠布局本身解决。 */
html,body{margin:0;padding:0;max-width:100%}
html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:contain;-webkit-user-select:none;user-select:none}
input,textarea,.ex,.zh-line,.en,.a{ -webkit-user-select:text;user-select:text }
button{touch-action:manipulation}
body{
  background:var(--bg); color:var(--text); font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--brand)}

/* ---------- 布局 ---------- */
.app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
.side{
  background:var(--card); border-right:1px solid var(--line); padding:20px 14px;
  position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px;
}
.logo{display:flex;align-items:center;gap:9px;padding:4px 8px 18px;font-weight:700;letter-spacing:.2px}
.logo .dot{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.logo small{display:block;font-weight:400;color:var(--muted);font-size:11px;letter-spacing:0}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);font-size:14.5px;width:100%;text-align:left;transition:.15s}
.nav-btn svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover{background:var(--chip);color:var(--text)}
.nav-btn.active{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(47,111,237,.28)}
.side .spacer{flex:1}
.side .mini{font-size:11.5px;color:var(--muted);padding:0 10px;line-height:1.7}

.main{padding:26px 30px 60px;max-width:1080px;width:100%;min-width:0}
.h1{font-size:22px;font-weight:700;margin:0 0 4px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){
  .g2,.g3{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ring{width:104px;height:104px;flex:0 0 104px}
  .ring svg{width:104px;height:104px}
  .ring .num b{font-size:21px}
  .ring .num span{font-size:10px}
  .hero{gap:14px}
}

/* ---------- 通用组件 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:11px;font-weight:600;font-size:14.5px;transition:.15s;border:1px solid transparent}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(47,111,237,.3)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--chip);color:var(--text)}
.btn.ghost:hover{filter:brightness(.97)}
.btn.line{border-color:var(--line);background:transparent;color:var(--text)}
.btn.danger{background:rgba(239,68,68,.1);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;background:var(--chip);color:var(--muted);font-weight:600}
.chip.new{background:rgba(47,111,237,.12);color:var(--brand)}
.chip.learn{background:rgba(245,158,11,.14);color:#b45309}
.chip.rev{background:rgba(124,92,255,.14);color:#6d4aff}
.chip.master{background:rgba(22,163,74,.13);color:var(--ok)}
.hidden{display:none!important}

/* ---------- 首页 ---------- */
.hero{display:flex;gap:26px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.ring{position:relative;width:132px;height:132px;flex:0 0 132px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.15}
.ring .num b{font-size:26px;font-weight:800}
.ring .num span{display:block;font-size:11px;color:var(--muted)}
.stat{padding:16px 18px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line)}
.stat .k{font-size:12px;color:var(--muted);margin-bottom:6px}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.5px}
.stat .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px}

/* ---------- 学习卡 ---------- */
.study-wrap{max-width:720px;margin:0 auto}
.study-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:7px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px;transition:.3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:38px 30px;min-height:310px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.qcard .en{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.25;word-break:break-word}
.qcard .en.small{font-size:25px}
.ipa{color:var(--muted);font-size:15px;margin-top:8px;font-family:"Segoe UI",serif}
.zh-line{font-size:22px;font-weight:700;margin-top:16px;line-height:1.4}
.ex{color:var(--muted);font-size:14.5px;margin-top:16px;max-width:560px;line-height:1.7}
.ex b{color:var(--text);font-weight:600}
.hint{color:var(--muted);font-size:13px;margin-top:10px}
.speak{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:var(--brand)}
.speak:hover{filter:brightness(.96)}
.speak svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rating{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.rating button{padding:13px 6px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--card);transition:.15s}
.rating button:hover{transform:translateY(-1px)}
.rating button small{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-top:2px}
.r0{color:var(--bad)} .r1{color:var(--warn)} .r2{color:var(--brand)} .r3{color:var(--ok)}
.rating button.r0:hover{border-color:var(--bad);background:rgba(239,68,68,.06)}
.rating button.r1:hover{border-color:var(--warn);background:rgba(245,158,11,.08)}
.rating button.r2:hover{border-color:var(--brand);background:rgba(47,111,237,.07)}
.rating button.r3:hover{border-color:var(--ok);background:rgba(22,163,74,.07)}
.answer-input{width:100%;max-width:420px;margin:18px auto 0;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;text-align:center;outline:none;letter-spacing:.3px}
.answer-input:focus{border-color:var(--brand)}
.verdict{margin-top:14px;font-weight:700;font-size:15px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.opts{display:grid;gap:10px;margin-top:20px;width:100%;max-width:520px}
.opt{padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);text-align:left;font-size:15px;transition:.15s}
.opt:hover{border-color:var(--brand)}
.opt.right{border-color:var(--ok);background:rgba(22,163,74,.08);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.08);color:var(--bad);font-weight:700}

/* ---------- 词库 ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input[type=search],.toolbar select{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);outline:none;font-size:14px}
.toolbar input[type=search]{min-width:220px;flex:1}
.wlist{display:grid;gap:10px}
.wrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;display:flex;gap:14px;align-items:flex-start}
.wrow .l{flex:1;min-width:0}
.wrow .en{font-weight:700;font-size:16px}
.wrow .ipa{display:inline;margin-left:8px;font-size:12.5px}
.wrow .zh{color:var(--muted);font-size:13.5px;margin-top:2px}
.wrow .exs{color:var(--muted);font-size:12.5px;margin-top:5px;opacity:.85}
.wrow .r{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.icon-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted);background:var(--chip)}
.icon-btn:hover{color:var(--text)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty{text-align:center;color:var(--muted);padding:50px 0}

/* ---------- 统计 ---------- */
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:5px;max-width:520px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--chip)}
.heat i.l1{background:rgba(47,111,237,.25)}
.heat i.l2{background:rgba(47,111,237,.5)}
.heat i.l3{background:rgba(47,111,237,.75)}
.heat i.l4{background:var(--brand)}
.legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.fbar{margin:9px 0}
.fbar .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.fbar .track{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.fbar .track i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px}

/* ---------- 面试 ---------- */
.iv-card{background:linear-gradient(135deg,rgba(47,111,237,.08),rgba(124,92,255,.08));border:1px solid var(--line);border-radius:18px;padding:34px 26px;text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center}
.iv-card .en{font-size:32px;font-weight:800}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;color:var(--brand)}
.tips{font-size:13.5px;color:var(--muted);line-height:1.85}
.tips b{color:var(--text)}
.tpl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.tpl .q{font-size:13px;color:var(--muted);margin-bottom:6px}
.tpl .a{font-size:14px;line-height:1.75}
.tpl .a em{color:var(--brand);font-style:normal;font-weight:600}

/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;background:rgba(10,15,30,.45);display:grid;place-items:center;padding:20px;z-index:50}
.modal .box{background:var(--card);border-radius:16px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);outline:none}
.field textarea{resize:vertical;min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- 提示 ---------- */
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:#1a1d24;color:#fff;padding:11px 20px;border-radius:11px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 移动端 ---------- */
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;padding:8px;
    padding-bottom:calc(8px + env(safe-area-inset-bottom, 0px));
    border-right:none;border-top:1px solid var(--line);z-index:40;justify-content:space-around;
    backdrop-filter:blur(12px);background:color-mix(in srgb, var(--card) 88%, transparent)}
  .side .logo,.side .spacer,.side .mini{display:none}
  .nav-btn{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 4px;justify-content:center;flex:1;min-height:48px}
  .nav-btn svg{width:21px;height:21px}
  .main{padding:16px 14px calc(96px + env(safe-area-inset-bottom, 0px))}
  .main .h1{font-size:20px}
  .qcard{padding:26px 18px;min-height:280px}
  .qcard .en{font-size:27px}
  .qcard .zh-line{font-size:20px}
  .qcard .ex{font-size:13.5px}
  .rating button{padding:15px 4px;font-size:15px}
  .rating button small{display:none}
  .btn{padding:12px 16px;font-size:15px;min-height:46px}
  .kbd-hint{display:none}
  .card{padding:16px}
  .stat .v{font-size:21px}
}
@media(max-width:380px){
  .qcard .en{font-size:23px}
  .rating button{font-size:13.5px;padding:13px 2px}
}
/* 卡片可点击翻面 */
.qcard.tap{cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><span class="dot">EE</span><span>术语积累<small>电子信息工程英语</small></span></div>
    <button class="nav-btn active" data-view="home">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>今日</button>
    <button class="nav-btn" data-view="study">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>学习</button>
    <button class="nav-btn" data-view="library">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>词库</button>
    <button class="nav-btn" data-view="stats">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>统计</button>
    <button class="nav-btn" data-view="interview">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>面试</button>
    <button class="nav-btn" data-view="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>设置</button>
    <div class="spacer"></div>
    <div class="mini" id="sideStat"></div>
  </aside>

  <main class="main">
    <div id="view-home"></div>
    <div id="view-study" class="hidden"></div>
    <div id="view-library" class="hidden"></div>
    <div id="view-stats" class="hidden"></div>
    <div id="view-interview" class="hidden"></div>
    <div id="view-settings" class="hidden"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   电子信息工程 英语专业术语 初始词库
   字段：en 英文 / ipa 音标 / pos 词性 / zh 中文 / ex 例句 / exZh 例句译文

<script>
/* ============================================================
   0. 基础工具
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY = () => ymd(new Date());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/** 用在 onclick="fn('...')" 里的参数：先为 JS 转义引号，再做 HTML 转义 */
const jsArg = s => esc(String(s ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'"));
const uid = s => String(s).trim().toLowerCase().replace(/\s+/g, " ");
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pct = (a,b) => b ? Math.round(a/b*100) : 0;

let toastTimer;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 1900);
}

/* ============================================================
   1. 数据层
   ============================================================ */
const LS_KEY = "eeTerms.v1";
const FIELDS = ["电路基础","信号与系统","通信原理","微机与嵌入式","电磁场与微波","控制与电力电子","计算机与AI","学术与面试"];
const DEFAULT_SETTINGS = { newPerDay:10, reviewCap:120, theme:"light", rate:0.9, autoSpeak:true, voice:"" };

let db = null;

function blankDB(){
  return {
    words: SEED_WORDS.map(w => ({ ...w, id: uid(w.en), custom:false })),
    prog: {}, log: {}, settings: {...DEFAULT_SETTINGS},
    meta: { created: TODAY(), seeded:true }
  };
}

function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      db = JSON.parse(raw);
      db.settings = { ...DEFAULT_SETTINGS, ...(db.settings||{}) };
      db.words = (db.words||[]).map(w => ({ ...w, id: w.id || uid(w.en) }));
      db.prog = db.prog || {}; db.log = db.log || {};
      return;
    }
  }catch(e){ console.warn("读取失败，重建", e); }
  db = blankDB();
  saveDB();
}

function saveDB(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(db)); }
  catch(e){ toast("保存失败：浏览器存储不可用"); }
}

/* ---------- 记忆曲线（简化版 SM-2） ---------- */
function newProg(id){
  return { id, ease:2.5, iv:0, reps:0, lapses:0, due:TODAY(), last:"", status:"new", right:0, wrong:0 };
}
function getProg(id){ return db.prog[id] || null; }
function statusOf(id){
  const p = db.prog[id];
  if(!p || p.status === "new") return "new";
  return p.status;
}
function schedule(id, q){
  const p = db.prog[id] || newProg(id);
  const t = TODAY();
  p.reps = p.reps || 0;
  if(q === 0){
    p.ease = Math.max(1.3, p.ease - 0.2);
    p.iv = 0; p.lapses++; p.reps = 0; p.wrong++;
    p.status = "learning";
    p.due = t;                       // 今天再来一次
  }else{
    if(p.iv === 0) p.iv = q === 3 ? 3 : 1;
    else if(q === 1) p.iv = Math.max(1, Math.round(p.iv * 1.2));
    else if(q === 2) p.iv = Math.max(2, Math.round(p.iv * p.ease));
    else { p.ease = Math.min(3.2, p.ease + 0.15); p.iv = Math.max(3, Math.round(p.iv * p.ease * 1.15)); }
    p.right++;
    p.status = (p.iv >= 21 && p.ease >= 2.6) ? "mastered" : "review";
    p.due = ymd(addDays(new Date(), p.iv));
  }
  p.last = t;
  db.prog[id] = p;
  saveDB();
  return p;
}

/* ---------- 日志 / 打卡 ---------- */
function bumpLog(field, n=1){
  const t = TODAY();
  const L = db.log[t] || (db.log[t] = { new:0, rev:0, correct:0, total:0 });
  L[field] = (L[field]||0) + n;
  saveDB();
}
function todayLog(){ return db.log[TODAY()] || { new:0, rev:0, correct:0, total:0 }; }
function streak(){
  let s = 0, d = new Date();
  if(!(db.log[TODAY()] && db.log[TODAY()].total > 0)) d = addDays(d, -1);   // 今天还没学，从昨天算
  while(db.log[ymd(d)] && db.log[ymd(d)].total > 0){ s++; d = addDays(d, -1); }
  return s;
}

/* ---------- 待学/待复习 ---------- */
function dueReviews(){
  const t = TODAY();
  return db.words.filter(w => {
    const p = db.prog[w.id];
    return p && p.status !== "mastered" && p.due <= t;
  }).sort((a,b) => (db.prog[a.id].due < db.prog[b.id].due ? -1 : 1));
}
function freshWords(){
  return db.words.filter(w => !db.prog[w.id]);
}
function todayNewQuota(){
  const used = todayLog().new || 0;
  return Math.max(0, (db.settings.newPerDay || 10) - used);
}

/* ============================================================
   2. 发音
   ============================================================ */
let voices = [];
function loadVoices(){
  if(!window.speechSynthesis) return;
  voices = speechSynthesis.getVoices() || [];
}
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;
function speak(text){
  if(!window.speechSynthesis){ toast("当前浏览器不支持发音"); return; }
  if(!voices.length) loadVoices();
  const u = new SpeechSynthesisUtterance(text);
  const pref = db.settings.voice;
  let v = pref ? voices.find(x => x.name === pref) : null;
  if(!v) v = voices.find(x => /en[-_]US/i.test(x.lang)) || voices.find(x => /^en/i.test(x.lang));
  if(v) u.voice = v;
  u.lang = (v && v.lang) || "en-US";

    </div>`;

function buildQueue(mode){
  const quota = todayNewQuota();
  const reviews = dueReviews().slice(0, db.settings.reviewCap || 120);
  const news = freshWords().slice(0, quota);
  let q = [...reviews, ...news];
  if(mode === "spell" || mode === "listen" || mode === "choice"){
    // 练习模式：把今天已经学过的词也放进来，保证有内容可练
    if(q.length < 8){
      const pool = db.words.filter(w => db.prog[w.id] && !q.includes(w)).slice(0, 20);
      q = q.concat(shuffle(pool).slice(0, 8 - q.length));
    }
  }
  if(!q.length){
    const pool = db.words.filter(w => statusOf(w.id) !== "mastered");
    q = shuffle(pool).slice(0, 10);
  }
  return shuffle(q);
}

function startSession(mode){
  const queue = buildQueue(mode);
  if(!queue.length){ toast("没有可学习的词，去词库添加吧"); return; }
  S = { mode, queue, i:0, correct:0, wrong:0, revealed:false, answered:false, opts:null };
  go("study");
  $("#view-study").innerHTML = `<div class="study-wrap" id="studyBody"></div>`;
  renderCard();
}

function renderCard(){
  if(!S) return;
  if(S.i >= S.queue.length){ finishSession(); return; }
  const w = S.queue[S.i];
  const body = $("#studyBody");
  const prog = ((S.i) / S.queue.length) * 100;

  // 选择题：本卡第一次渲染时生成选项
  if(S.mode === "choice" && !S.opts){
    const others = shuffle(db.words.filter(x => x.id !== w.id && x.zh !== w.zh)).slice(0,3).map(x => x.zh);
    S.opts = shuffle([w.zh, ...others]);
  }

  let inner = `
    <button class="speak" title="朗读" onclick="event.stopPropagation();speak('${jsArg(w.en)}')">
      <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M19 6a9 9 0 0 1 0 12"/></svg>
    </button>`;

  if(S.mode === "learn"){
    inner += `<div class="en ${w.en.length>16?"small":""}">${esc(w.en)}</div>`;
    if(w.ipa) inner += `<div class="ipa">${esc(w.ipa)}</div>`;
    if(S.revealed){
      inner += `<div class="zh-line">${esc(w.zh)}</div>`;
      if(w.ex) inner += `<div class="ex"><b>${esc(w.ex)}</b><br>${esc(w.exZh||"")}</div>`;
    }else{
      inner += `<div class="hint">先在心里说出中文意思，再翻卡（空格键）</div>`;
    }
  }

  if(S.mode === "spell"){
    inner += `<div class="zh-line">${esc(w.zh)}</div>`;
    if(w.ipa) inner += `<div class="ipa">${esc(w.ipa)}</div>`;
    inner += `<div class="hint">首字母：<b style="font-size:16px;color:var(--text)">${esc(w.en[0])}</b> · 共 ${w.en.replace(/\s/g,"").length} 个字母（不含空格）</div>`;
    inner += `<input class="answer-input" id="ansInput" placeholder="在此输入英文" autocomplete="off" spellcheck="false" ${S.answered?"disabled":""}>`;
    if(S.answered){
      inner += `<div class="verdict ${S.lastOK?"ok":"no"}">${S.lastOK?"✓ 正确":"✗ 正确答案：" + esc(w.en)}</div>`;
    }
  }

  if(S.mode === "listen"){
    inner += `<div class="zh-line" style="font-size:17px;color:var(--muted)">听发音，写出英文单词</div>`;
    inner += `<div style="margin:18px 0"><button class="btn ghost" onclick="speak('${jsArg(w.en)}')">🔊 再听一次</button></div>`;
    inner += `<input class="answer-input" id="ansInput" placeholder="在此输入你听到的单词" autocomplete="off" spellcheck="false" ${S.answered?"disabled":""}>`;
    if(S.answered) inner += `<div class="verdict ${S.lastOK?"ok":"no"}">${S.lastOK?"✓ 正确":"✗ 正确答案：" + esc(w.en)}</div>`;
  }

  if(S.mode === "choice"){
    inner += `<div class="en ${w.en.length>16?"small":""}">${esc(w.en)}</div>`;
    if(w.ipa) inner += `<div class="ipa">${esc(w.ipa)}</div>`;
    inner += `<div class="opts">${S.opts.map((o,k) => {
      let cls = "opt";
      if(S.answered){
        if(o === w.zh) cls += " right";
        else if(k === S.picked) cls += " wrong";
      }
      return `<button class="${cls}" ${S.answered?"disabled":""} onclick="pickOpt(${k})">${esc(o)}</button>`;
    }).join("")}</div>`;
  }

  // 底部按钮
  let bottom = "";
  if(S.mode === "learn"){
    if(!S.revealed){
      bottom = `<div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn primary" style="flex:1" onclick="reveal()">显示答案（空格）</button>
        <button class="btn ghost" onclick="rate(0)">不认识</button></div>`;
    }else{
      bottom = `<div class="rating">
        <button class="r0" onclick="rate(0)">忘记<small>重来</small></button>
        <button class="r1" onclick="rate(1)">模糊<small>1天</small></button>
        <button class="r2" onclick="rate(2)">记得<small>间隔×2.5</small></button>
        <button class="r3" onclick="rate(3)">很熟<small>间隔×3</small></button></div>`;
    }
  }else if(S.mode === "spell" || S.mode === "listen"){
    if(!S.answered){
      bottom = `<div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn primary" style="flex:1" onclick="checkSpell()">提交（回车）</button>
        <button class="btn ghost" onclick="showSpellAnswer()">不会，看答案</button></div>`;
    }else{
      bottom = S.lastOK
        ? `<div class="rating" style="grid-template-columns:1fr 1fr">
             <button class="r2" onclick="rate(2)">记住了<small>继续</small></button>
             <button class="r3" onclick="rate(3)">太简单<small>拉长间隔</small></button></div>`
        : `<div class="rating" style="grid-template-columns:1fr 1fr">
             <button class="r0" onclick="rate(0)">再来一次<small>今天重排</small></button>
             <button class="r1" onclick="rate(1)">勉强记住<small>1天</small></button></div>`;
    }
  }else if(S.mode === "choice"){
    if(S.answered){
      bottom = S.lastOK
        ? `<div class="rating" style="grid-template-columns:1fr 1fr">
             <button class="r2" onclick="rate(2)">记住了<small>继续</small></button>
             <button class="r3" onclick="rate(3)">太简单<small>拉长间隔</small></button></div>`
        : `<div class="rating" style="grid-template-columns:1fr 1fr">
             <button class="r0" onclick="rate(0)">再来一次<small>今天重排</small></button>
             <button class="r1" onclick="rate(1)">勉强记住<small>1天</small></button></div>`;
    }
  }

  const tappable = (S.mode === "learn" && !S.revealed) ? "tap" : "";
  $("#studyBody").innerHTML = `
    <div class="study-top">
      <span class="chip">${S.i+1} / ${S.queue.length}</span>
      <div class="bar"><i style="width:${prog}%"></i></div>
      <button class="icon-btn" title="退出" onclick="quitSession()">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="qcard ${tappable}" ${tappable?'onclick="reveal()"':''}>${inner}</div>
    ${bottom}
    <div style="text-align:center;margin-top:14px;color:var(--muted);font-size:12px">
      正确答案 ${S.correct} · 错误 ${S.wrong}
      <span class="kbd-hint"> · 快捷键：空格翻卡 / 1-4 评分 / 回车提交</span>
    </div>`;

  const inp = $("#ansInput");
  if(inp){
    inp.focus();
    inp.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); checkSpell(); } };
    if(S.mode === "listen" && db.settings.autoSpeak && !S.answered) speak(w.en);
  }
}

function reveal(){
  S.revealed = true;
  const w = S.queue[S.i];
  if(db.settings.autoSpeak) speak(w.en);
  renderCard();
}

function pickOpt(k){
  if(S.answered) return;
  const w = S.queue[S.i];
  S.answered = true; S.picked = k;
  S.lastOK = S.opts[k] === w.zh;
  S.lastOK ? S.correct++ : S.wrong++;
  if(!S.lastOK) speak(w.en);
  renderCard();
}

function norm(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim(); }

function checkSpell(){
  if(S.answered) return;
  const w = S.queue[S.i];
  const inp = $("#ansInput");
  const val = inp ? inp.value : "";
  if(!val.trim()){ toast("先输入答案"); return; }
  const ok = norm(val) === norm(w.en);
  S.answered = true; S.lastOK = ok;
  ok ? S.correct++ : S.wrong++;
  if(!ok) speak(w.en);
  renderCard();
}

function showSpellAnswer(){
  S.answered = true; S.lastOK = false; S.wrong++;
  const w = S.queue[S.i];
  speak(w.en);
  renderCard();
}

function rate(q){
  const w = S.queue[S.i];
  const isNew = !db.prog[w.id];
  const p = schedule(w.id, q);

  const L = db.log[TODAY()] || (db.log[TODAY()] = { new:0, rev:0, correct:0, total:0 });
  L.total = (L.total || 0) + 1;
  if(S.lastOK) L.correct = (L.correct || 0) + 1;
  if(isNew) L.new = (L.new || 0) + 1; else L.rev = (L.rev || 0) + 1;
  saveDB();

  if(q === 0) S.queue.push(w);          // 没记住：本轮末尾再来一次
  S.i++; S.revealed = false; S.answered = false; S.lastOK = null; S.picked = null; S.opts = null;
  renderCard();
}

function quitSession(){
  S = null;
  go("home");
}

function finishSession(){
  const total = S.correct + S.wrong;
  const acc = total ? Math.round(S.correct/total*100) : 0;
  $("#studyBody").innerHTML = `
    <div class="qcard" style="min-height:280px">
      <div style="font-size:46px">🎯</div>
      <div style="font-size:20px;font-weight:800;margin-top:12px">本轮完成</div>
      <div style="color:var(--muted);margin-top:8px">共 ${total} 次作答 · 正确率 <b style="color:${acc>=80?'var(--ok)':'var(--warn)'}">${acc}%</b></div>
      <div style="color:var(--muted);font-size:13px;margin-top:6px">连续打卡 ${streak()} 天 · 今日累计 ${todayLog().total||0} 次</div>
      <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center">
        <button class="btn primary" onclick="startSession('${S.mode}')">再来一轮</button>
        <button class="btn ghost" onclick="go('stats')">看统计</button>
        <button class="btn line" onclick="go('home')">回首页</button>
      </div>
    </div>`;
  S = null;
  renderSide();
}

    </div>
    <div class="wlist" id="wlist"></div>`;

  const q = $("#libQ"), f = $("#libField"), s = $("#libStatus");
  q.oninput = () => { libFilter.q = q.value; drawList(); };
  f.onchange = () => { libFilter.field = f.value; drawList(); };
  s.onchange = () => { libFilter.status = s.value; drawList(); };
  drawList();
}

function drawList(){
  const kw = libFilter.q.trim().toLowerCase();
  let list = db.words.filter(w => {
    if(libFilter.field && w.field !== libFilter.field) return false;
    if(libFilter.status && statusOf(w.id) !== libFilter.status) return false;
    if(kw){
      const s = [w.en,w.zh,w.ex,w.exZh,w.field].join(" ").toLowerCase();
      if(!s.includes(kw)) return false;
    }
    return true;
  });
  const chipOf = st => ({new:["new","未开始"],learning:["learn","学习中"],review:["rev","复习中"],mastered:["master","已掌握"]}[st]);
  const box = $("#wlist");
  if(!list.length){ box.innerHTML = `<div class="empty">没有匹配的词条</div>`; return; }
  box.innerHTML = list.map(w => {
    const st = statusOf(w.id); const [cls,txt] = chipOf(st);
    const p = db.prog[w.id];
    return `<div class="wrow">
      <div class="l">
        <div><span class="en">${esc(w.en)}</span>${w.ipa?`<span class="ipa">${esc(w.ipa)}</span>`:""}
          <span class="chip ${cls}" style="margin-left:6px">${txt}</span>
          <span class="chip" style="margin-left:4px">${esc(w.field||"未分类")}</span></div>
        <div class="zh">${esc(w.zh)}${p&&p.due?` · 下次复习 ${p.due}`:""}</div>
        ${w.ex?`<div class="exs">${esc(w.ex)}</div>`:""}
      </div>
      <div class="r">
        <button class="icon-btn" title="朗读" onclick="speak('${jsArg(w.en)}')">
          <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 8.5a5 5 0 0 1 0 7"/></svg></button>

function saveEditor(id){
  const en = $("#f_en").value.trim();
  const zh = $("#f_zh").value.trim();
  if(!en || !zh){ toast("英文和中文为必填"); return; }
  const nid = uid(en);
  const data = {
    id: nid, en,
    ipa: $("#f_ipa").value.trim(), pos: $("#f_pos").value.trim(), zh,
    ex: $("#f_ex").value.trim(), exZh: $("#f_exZh").value.trim(),
    field: $("#f_field").value, level: +$("#f_level").value
  };
  if(id && id !== nid){
    db.words = db.words.filter(w => w.id !== id);
    delete db.prog[id];
  }
  const i = db.words.findIndex(w => w.id === nid);
  if(i >= 0) db.words[i] = { ...db.words[i], ...data };
  else db.words.push({ ...data, custom:true });
  saveDB(); closeModal(); drawList(); toast("已保存");
}

function delWord(id){
  const w = db.words.find(x => x.id === id);
  if(!confirm(`确定删除「${w.en}」吗？学习记录也会一并删除。`)) return;
  db.words = db.words.filter(x => x.id !== id);
  delete db.prog[id];
  saveDB(); drawList(); renderSide(); toast("已删除");
}

function doImport(){
  const lines = $("#impText").value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  let ok = 0;
  lines.forEach(line => {
    const c = line.split("|").map(s=>s.trim());
    if(c.length < 2 || !c[0] || !c[1]) return;
    const id = uid(c[0]);
    if(db.words.some(w => w.id === id)) return;
    db.words.push({ id, en:c[0], zh:c[1], ipa:c[2]||"", ex:c[3]||"", exZh:c[4]||"",
                    field:c[5]||"学术与面试", pos:"", level:2, custom:true });
    ok++;
  });
  saveDB(); closeModal(); drawList(); toast(`成功导入 ${ok} 条`);
}

function exportCSV(){
  const rows = [["英文","音标","词性","中文","英文例句","例句译文","方向","状态"]];
  db.words.forEach(w => rows.push([w.en,w.ipa||"",w.pos||"",w.zh,w.ex||"",w.exZh||"",w.field||"",statusOf(w.id)]));
  const csv = "\uFEFF" + rows.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  download(csv, `EE术语库_${TODAY()}.csv`, "text/csv;charset=utf-8");
}

function download(content, name, type){
  const blob = new Blob([content], {type: type || "text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}

function importJSON(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      if(!data.words) throw new Error("格式不对");
      if(!confirm("导入将覆盖当前全部数据，确定吗？")) return;
      db = data;
      db.settings = { ...DEFAULT_SETTINGS, ...(db.settings||{}) };
      saveDB(); applyTheme(); go("home"); toast("导入成功");
    }catch(e){ toast("导入失败：文件格式不正确"); }
  };
  r.readAsText(f);
  input.value = "";
}

  if(!confirm("清空所有学习记录（词库保留）？")) return;
  db.prog = {}; db.log = {}; saveDB(); renderSide(); toast("已清空学习记录");

  db = blankDB(); saveDB(); applyTheme(); go("home"); toast("已重置");

  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
  }else{
    const ua = navigator.userAgent;
    if(/iPhone|iPad|iPod/i.test(ua)) toast("Safari：点底部「分享」→「添加到主屏幕」");
    else toast("浏览器菜单 ⋮ →「添加到主屏幕 / 安装应用」");
  }
}
function isInstalled(){
  try{
    if(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
    return !!(window.navigator && window.navigator.standalone === true);
  }catch(e){ return false; }
}

/* Service Worker：https 或 localhost 下注册（file:// 打开时自动跳过，不影响使用） */
const SW_SECURE = location.protocol === "https:" ||
                  location.hostname === "localhost" ||
                  location.hostname === "127.0.0.1";
if("serviceWorker" in navigator && SW_SECURE){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

/* ============================================================
   12. 启动
   ============================================================ */
loadDB();
applyTheme();
loadVoices();
go("home");
setTimeout(loadVoices, 400);
</script>
